services:
  app:
    image: learn-backend-04-app
    container_name: learn-backend-04-app
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SSLMODE: disable
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER is missing from .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing from .env}
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is missing from .env}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: learn-backend-04-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is missing from .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing from .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is missing from .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:

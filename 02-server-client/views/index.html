<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <title>My Client</title>
    <link rel="stylesheet" href="/static/css.css" />
  </head>
  <body>
    <h1>My client</h1>

    <div class="container">
      <!-- Form: the browser sends it directly, no JavaScript -->
      <form id="product-form" method="POST" action="/products">
        <label>
          Name
          <input type="text" name="name" required />
        </label>
        <label>
          Price
          <input type="number" name="price" step="0.01" min="0" required />
        </label>
        <label>
          Stock
          <input type="number" name="stock" min="0" required />
        </label>
        <button type="submit">Create</button>

        {{if .Error}}
        <p>{{.Error}}</p>
        {{end}} {{if .Success}}
        <p>{{.Success}}</p>
        {{end}}
      </form>

      <!-- Table rendered by the server -->
      <div>
        <table id="products">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Price</th>
              <th>Stock</th>
            </tr>
          </thead>
          <tbody id="products-body">
            {{range .Products}}
            <tr>
              <td>{{.ID}}</td>
              <td>{{.Name}}</td>
              <td>{{.Price}}</td>
              <td>{{.Stock}}</td>
            </tr>
            {{else}}
            <tr>
              <td colspan="4">No products</td>
            </tr>
            {{end}}
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
